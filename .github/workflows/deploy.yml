name: Deploy backend (EC2)

# Runs only when triggered manually or after CI passes on master.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["backend/**", "deploy/**"]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Typecheck, test and build
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on EC2 (build, health check, auto-rollback)
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/SkillPath && git fetch origin master && git reset --hard origin/master && ./deploy/deploy.sh"

      - name: Public health check
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://${{ secrets.API_DOMAIN }}/api/healthz" && exit 0
            sleep 10
          done
          echo "Public health check failed" && exit 1
